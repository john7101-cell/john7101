<template>
  <style>
    #root { position: absolute; inset: 0; background: #1c1018; }
    #world-canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  </style>
  <div id="root" data-composition-id="world" data-width="1920" data-height="1080">
    <div id="world-stage" class="clip" data-start="0" data-duration="82.5" data-layout-ignore>
      <canvas id="world-canvas" width="1920" height="1080"></canvas>
          </div>
  </div>
  <script type="module">
    import * as THREE from "./assets/lib/three.module.min.js";

    const DURATION = 82.5;
    // Cambios de escena: la cámara da un "empujón" hacia adelante en cada uno
    const CUTS = [4.25, 11.1, 19.35, 28.15, 37.4, 48.55, 57.5, 66.9, 74.8];
    const PUSH = 7.0, PUSH_DUR = 0.8, DRIFT = 0.75;

    // PRNG con semilla (determinista)
    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rnd = mulberry32(20261115);
    const smooth = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * x * (x * (x * 6 - 15) + 10));
    const clamp01 = (x) => Math.max(0, Math.min(1, x));

    function camZ(t) {
      let z = 6 - DRIFT * t;
      for (const c of CUTS) z -= PUSH * smooth((t - (c - PUSH_DUR / 2)) / PUSH_DUR);
      return z;
    }

    const canvas = document.getElementById("world-canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(1920, 1080, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#1c1018");
    scene.fog = new THREE.FogExp2("#1c1018", 0.028);
    const camera = new THREE.PerspectiveCamera(42, 1920 / 1080, 0.1, 400);

    // ---------- partículas bokeh
    const tex = (() => {
      const c = document.createElement("canvas");
      c.width = c.height = 128;
      const g = c.getContext("2d");
      const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      grd.addColorStop(0, "rgba(255,255,255,1)");
      grd.addColorStop(0.35, "rgba(255,255,255,0.55)");
      grd.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = grd;
      g.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    })();
    const N = 1800;
    const pos = new Float32Array(N * 3), base = new Float32Array(N * 3), col = new Float32Array(N * 3), phase = new Float32Array(N);
    const palette = ["#e0679a", "#c98bbf", "#f0b6d2", "#f6e9f0"].map((h) => new THREE.Color(h));
    const zEnd = camZ(DURATION) - 60;
    for (let i = 0; i < N; i++) {
      let x, y;
      do { x = (rnd() * 2 - 1) * 22; y = (rnd() * 2 - 1) * 12; } while (Math.hypot(x * 0.6, y) < 2.6);
      const z = 10 + rnd() * (zEnd - 10);
      base[i * 3] = x; base[i * 3 + 1] = y; base[i * 3 + 2] = z;
      const c = palette[Math.floor(rnd() * palette.length)];
      const k = 0.35 + rnd() * 0.65;
      col[i * 3] = c.r * k; col[i * 3 + 1] = c.g * k; col[i * 3 + 2] = c.b * k;
      phase[i] = rnd() * Math.PI * 2;
    }
    const pgeo = new THREE.BufferGeometry();
    pgeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    pgeo.setAttribute("color", new THREE.BufferAttribute(col, 3));
    const pmat = new THREE.PointsMaterial({ size: 0.7, map: tex, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true });
    scene.add(new THREE.Points(pgeo, pmat));

    // ---------- luces
    scene.add(new THREE.AmbientLight("#ffffff", 0.55));
    const key = new THREE.DirectionalLight("#ffe6f1", 2.2);
    scene.add(key, key.target);
    const rim = new THREE.PointLight("#e0679a", 60, 30, 1.6);
    scene.add(rim);

    // ---------- loto 3D (escena 2 y cierre)
    function makeLotus() {
      const group = new THREE.Group();
      const petalGeo = new THREE.SphereGeometry(1, 40, 20);
      const rings = [
        { n: 9, r: 0.42, len: 1.15, color: "#e0679a", open: 1.12, off: 0 },
        { n: 7, r: 0.26, len: 0.95, color: "#ee8fb6", open: 0.72, off: 0.4 },
        { n: 5, r: 0.12, len: 0.75, color: "#f0b6d2", open: 0.38, off: 0.15 },
      ];
      const hinges = [];
      const mats = [];
      for (const ring of rings) {
        const mat = new THREE.MeshStandardMaterial({ color: ring.color, emissive: ring.color, emissiveIntensity: 0.22, roughness: 0.48, metalness: 0.0, transparent: true, opacity: 1 });
        mats.push(mat);
        for (let k = 0; k < ring.n; k++) {
          const pivot = new THREE.Group();
          pivot.rotation.y = (k / ring.n) * Math.PI * 2 + ring.off;
          const hinge = new THREE.Group();
          hinge.position.x = ring.r;
          const m = new THREE.Mesh(petalGeo, mat);
          m.scale.set(0.34 * ring.len, ring.len, 0.12);
          m.position.y = ring.len * 0.95;
          hinge.add(m);
          pivot.add(hinge);
          group.add(pivot);
          hinges.push({ hinge, open: ring.open });
        }
      }
      const coreMat = new THREE.MeshStandardMaterial({ color: "#fff1f7", emissive: "#ffd6e8", emissiveIntensity: 1.6, transparent: true });
      mats.push(coreMat);
      const core = new THREE.Mesh(new THREE.SphereGeometry(0.22, 32, 16), coreMat);
      core.position.y = 0.25;
      group.add(core);
      scene.add(group);
      return { group, hinges, mats };
    }
    const lotus = makeLotus();

    function lotusState(t) {
      // devuelve visibilidad, apertura, posición relativa a la cámara
      const a = clamp01((t - 4.35) / 0.6) * (1 - clamp01((t - 10.75) / 0.35));
      const b = clamp01((t - 75.3) / 0.9);
      if (a > 0.001) return { vis: a, open: smooth((t - 4.4) / 2.6), x: -4.9, y: -0.9, d: 13, spin: (t - 4.25) * 0.18, s: 1.1 };
      if (b > 0.001) return { vis: b, open: 0.35 + 0.65 * smooth((t - 75.3) / 2.4), x: 0, y: 1.1, d: 13, spin: (t - 74.8) * 0.15, s: 1.05 };
      return { vis: 0, open: 0, x: 0, y: 0, d: 10, spin: 0, s: 1 };
    }

    function renderAt(t) {
      const cz = camZ(t);
      camera.position.set(Math.sin(t * 0.21) * 0.5, Math.sin(t * 0.17) * 0.3, cz);
      camera.lookAt(Math.sin(t * 0.21) * 0.25, 0, cz - 10);
      key.position.set(-6, 6, cz + 4);
      key.target.position.set(0, 0, cz - 12);
      rim.position.set(3, 2, cz - 16);

      for (let i = 0; i < N; i++) {
        const ph = phase[i];
        pos[i * 3] = base[i * 3] + Math.sin(t * 0.35 + ph) * 0.25;
        pos[i * 3 + 1] = base[i * 3 + 1] + Math.cos(t * 0.28 + ph * 1.3) * 0.3;
        pos[i * 3 + 2] = base[i * 3 + 2];
      }
      pgeo.attributes.position.needsUpdate = true;

      const L = lotusState(t);
      lotus.group.visible = L.vis > 0.001;
      if (lotus.group.visible) {
        lotus.group.position.set(L.x, L.y, cz - L.d);
        lotus.group.rotation.set(0.42, L.spin, 0);
        lotus.group.scale.setScalar(L.s * (0.85 + 0.15 * L.vis));
        for (const h of lotus.hinges) h.hinge.rotation.z = -(0.08 + (h.open - 0.08) * L.open);
        for (const m of lotus.mats) m.opacity = L.vis;
      }
      renderer.render(scene, camera);
    }

    window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
    renderAt(0);

    const tl = gsap.timeline({ paused: true });
    const clock = { t: 0 };
    tl.to(clock, { t: DURATION, duration: DURATION, ease: "none" }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines["world"] = tl;
  </script>
</template>
